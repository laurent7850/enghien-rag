# Mises à jour automatiques des dépendances (remplace la tâche hebdomadaire Claude depuis le 06/11/2026).
# - correctifs et mineures : une seule PR groupée par passage ;
# - majeures : une PR par paquet, jamais groupée, à valider une par une ;
# - failles : PR de sécurité immédiates, dès que Dependabot security updates est activé (Settings → Code security).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 10
    groups:
      mineures-et-correctifs:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Brussels
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
